<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8FAFC;
            background-image:
                radial-gradient(at 10% 20%, rgba(59, 130, 246, 0.1) 0px, transparent 60%),
                radial-gradient(at 80% 10%, rgba(139, 92, 246, 0.1) 0px, transparent 60%),
                radial-gradient(at 90% 80%, rgba(236, 72, 153, 0.1) 0px, transparent 60%),
                radial-gradient(at 20% 90%, rgba(16, 185, 129, 0.1) 0px, transparent 60%);
            min-height: 100vh;
            color: #0f172a;
            position: relative;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            border-radius: 1.25rem;
        }

        .category-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 99px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .sync-indicator {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
        }

        .syncing .sync-dot {
            animation: pulse 1.5s infinite;
            background-color: #3b82f6;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header
            class="mb-10 flex flex-col md:flex-row md:items-center justify-between gap-6 glass-card p-6 md:px-8 rounded-3xl md:rounded-full shadow-sm mt-4">
            <div class="flex-1 w-full text-center md:text-left">
                <h1
                    class="text-3xl md:text-4xl font-extrabold bg-clip-text drop-shadow-sm mb-3 md:mb-1 flex justify-center md:justify-start items-center gap-3">
                    🌍 Travel Expense Tracker
                </h1>
                <div
                    class="flex flex-col sm:flex-row flex-wrap sm:items-center justify-center md:justify-start gap-x-4 gap-y-3">
                    <p class="text-slate-600 font-medium text-sm">Log spending, track categories, and settle up.</p>
                    <div class="flex items-center justify-center gap-3">
                        <div id="syncStatus"
                            class="sync-indicator text-slate-500 font-medium bg-white/60 px-3 py-1 rounded-full border border-slate-200 shadow-sm">
                            <div class="sync-dot"></div> <span id="syncText">Connected</span>
                        </div>
                        <span
                            class="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-100 px-2.5 py-1 rounded-full font-mono font-bold shadow-sm"
                            id="displayTripId">ID: ...</span>
                    </div>
                </div>
            </div>
            <div class="flex flex-col items-center md:items-end gap-3 w-full md:w-auto mt-4 md:mt-0">
                <div class="flex flex-row flex-wrap justify-center items-center gap-3">
                    <button onclick="copyShareLink()"
                        class="flex-1 md:flex-none bg-gradient-to-r from-slate-800 to-slate-900 text-white px-5 py-3 rounded-xl hover:from-black hover:to-black font-bold text-sm flex items-center justify-center gap-2 shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">
                        🔗 Share
                    </button>
                    <button onclick="startNewTrip()"
                        class="flex-1 md:flex-none bg-white text-slate-800 border-2 border-slate-200/80 px-5 py-2.5 rounded-xl hover:bg-slate-50 hover:border-slate-300 font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-2 hover:-translate-y-0.5 pointer bg-opacity-70 backdrop-blur-sm">
                        ✨ New
                    </button>
                    <button onclick="joinTrip()"
                        class="flex-1 md:flex-none bg-white text-slate-800 border-2 border-slate-200/80 px-5 py-2.5 rounded-xl hover:bg-slate-50 hover:border-slate-300 font-bold text-sm shadow-sm transition-all flex items-center justify-center gap-2 hover:-translate-y-0.5 pointer bg-opacity-70 backdrop-blur-sm">
                        📂 Join
                    </button>
                </div>
                <div
                    class="flex items-center justify-center gap-1.5 bg-white/70 px-4 py-1.5 rounded-full border border-slate-200 shadow-sm">
                    <span class="text-[10px] font-bold text-slate-600 uppercase tracking-widest">Base Cur:</span>
                    <select id="primaryCurrencySelect" onchange="changePrimaryCurrency()"
                        class="text-xs bg-transparent font-bold text-slate-800 outline-none cursor-pointer">
                    </select>
                </div>
            </div>
        </header>

        <p class="text-xs text-slate-500 -mt-6 mb-8 text-center md:text-right italic px-4 font-medium">
            💡 Tip: This URL is your "Key". Bookmark it or share it with friends to auto-sync!
        </p>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Left Column: Setup & People (4 cols) -->
            <!-- Left Column: Setup & People (4 cols) -->
            <div class="lg:col-span-4 space-y-6">
                <div class="glass-card p-6 shadow-sm border-t-4 border-t-blue-500">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-3 text-slate-800">
                        <span class="text-blue-500 bg-blue-50 p-2 rounded-xl">👥</span> Trip Group
                    </h2>
                    <div class="flex flex-col sm:flex-row gap-3 mb-5">
                        <input id="personName" type="text" placeholder="Add friend name..."
                            class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white/60 focus:bg-white transition-all text-sm shadow-sm">
                        <button onclick="addPerson()"
                            class="w-full sm:w-auto bg-blue-600 text-white px-6 py-3 rounded-xl hover:bg-blue-700 font-bold shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5">Add</button>
                    </div>
                    <ul id="peopleList" class="space-y-3"></ul>
                </div>

                <!-- Recent Trips -->
                <div id="recentTripsContainer" class="glass-card p-6 border-t-4 border-t-orange-400 shadow-sm hidden">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-3 text-slate-800">
                        <span class="text-orange-500 bg-orange-50 p-2 rounded-xl">⏱️</span> Recent Trips
                    </h2>
                    <ul id="recentTripsList" class="space-y-3 text-sm text-slate-600">
                        <!-- Recent trips go here -->
                    </ul>
                </div>

                <!-- Settlement Summary -->
                <div
                    class="glass-card p-6 shadow-sm bg-gradient-to-br from-blue-50/80 to-indigo-50/80 border border-blue-100/50">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-3 text-slate-800">
                        <span class="text-blue-600 bg-blue-100 p-2 rounded-xl">📊</span> Final Balances
                    </h2>
                    <div id="balanceContainer" class="space-y-3">
                        <!-- Debt instructions go here -->
                    </div>
                </div>
            </div>

            <!-- Right Column: Add Expense & History (8 cols) -->
            <div class="lg:col-span-8 space-y-6">

                <!-- Add Expense Form -->
                <div
                    class="glass-card p-6 md:p-8 rounded-3xl shadow-sm border-t-4 border-t-emerald-400 relative overflow-hidden">
                    <div
                        class="absolute top-0 right-0 w-64 h-64 bg-emerald-400 opacity-5 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none">
                    </div>

                    <h2 class="text-xl font-extrabold mb-6 text-slate-800 flex items-center gap-3">
                        <span class="bg-emerald-100 p-2.5 rounded-xl text-emerald-600">💸</span> Add New Expense
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-6">
                        <div>
                            <label
                                class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 block">Description</label>
                            <input id="expDesc" type="text" placeholder="e.g. Sushi Dinner"
                                class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none bg-white/60 focus:bg-white focus:ring-2 focus:ring-emerald-500 transition-all text-sm shadow-sm">
                        </div>
                        <div>
                            <label
                                class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 block">Amount</label>
                            <div class="flex shadow-sm rounded-xl">
                                <select id="expCurrency"
                                    class="px-3 py-3 border border-r-0 border-slate-200 rounded-l-xl outline-none bg-slate-50/80 text-sm font-bold w-24 cursor-pointer focus:bg-white text-slate-700">
                                </select>
                                <input id="expAmount" type="number" placeholder="0.00"
                                    class="w-full px-4 py-3 border border-slate-200 rounded-r-xl outline-none bg-white/60 focus:bg-white focus:ring-2 focus:ring-emerald-500 transition-all text-sm">
                            </div>
                        </div>

                        <div>
                            <label
                                class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 block">Category</label>
                            <select id="expCategory"
                                class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none bg-white/60 focus:bg-white focus:ring-2 focus:ring-emerald-500 transition-all text-sm cursor-pointer shadow-sm text-slate-700">
                                <option value="Food">🍔 Food & Drink</option>
                                <option value="Transport">🚗 Transport</option>
                                <option value="Lodging">🏨 Lodging</option>
                                <option value="Activities">🎡 Activities</option>
                                <option value="Shopping">🛍️ Shopping</option>
                                <option value="Other">📦 Other</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 block">Who
                                Paid?</label>
                            <select id="expPayer"
                                class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none bg-white/60 focus:bg-white focus:ring-2 focus:ring-emerald-500 transition-all text-sm cursor-pointer shadow-sm text-slate-700"></select>
                        </div>

                        <div class="sm:col-span-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">Split
                                with whom?</label>
                            <div id="splitCheckboxes"
                                class="flex flex-wrap gap-2 p-4 border border-slate-200 rounded-xl bg-white/40 backdrop-blur-sm min-h-[3.5rem] shadow-sm">
                                <!-- Group members -->
                            </div>
                        </div>
                    </div>
                    <button onclick="addExpense()"
                        class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white py-3.5 rounded-xl font-bold text-[15px] hover:from-emerald-600 hover:to-teal-600 transition-all shadow-md hover:shadow-xl transform hover:-translate-y-0.5">
                        Log Expense
                    </button>
                </div>

                <!-- History -->
                <div class="mt-10">
                    <h2 class="text-xl font-extrabold mb-5 flex items-center gap-3 text-slate-800">
                        <span class="bg-indigo-100 p-2.5 rounded-xl text-indigo-500">📜</span> Transaction History
                    </h2>
                    <div id="historyList" class="space-y-4"></div>
                </div>

            </div>
        </div>

        <!-- Danger Zone: Clear Trip -->
        <div class="mt-16 mb-12 text-center flex flex-col items-center">
            <div class="w-16 h-1 bg-slate-200 rounded-full mb-8"></div>
            <button onclick="clearAll()"
                class="text-sm font-bold text-red-600 hover:text-red-700 bg-white/60 hover:bg-red-50 border border-red-200 px-6 py-3 rounded-full transition-all shadow-sm hover:shadow-md flex items-center gap-2 transform hover:-translate-y-0.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                Clear All Trip Data
            </button>
        </div>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

        // Firebase configuration 
        // Please replace with your own Firebase CDN configuration 
        // You can get your own Firebase configuration from the Firebase Console
        // https://console.firebase.google.com/ 
        // const firebaseConfig = {
        //    apiKey: "[GCP_API_KEY]",
        //    authDomain: "",
        //    databaseURL: "",
        //    projectId: "",
        //    storageBucket: "",
        //    messagingSenderId: "",
        //    appId: "",
        //    measurementId: ""
        // };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Data & State Management ---
        let people = [];
        let expenses = [];
        let tripId = window.location.hash.substring(1);

        const SUPPORTED_CURRENCIES = {
            'USD': { symbol: '$', name: 'US Dollar' },
            'EUR': { symbol: '€', name: 'Euro' },
            'GBP': { symbol: '£', name: 'British Pound' },
            'JPY': { symbol: '¥', name: 'Japanese Yen' },
            'CAD': { symbol: 'CA$', name: 'Canadian Dollar' },
            'AUD': { symbol: 'A$', name: 'Australian Dollar' },
            'CNY': { symbol: 'CN¥', name: 'Chinese Yuan' },
            'INR': { symbol: '₹', name: 'Indian Rupee' },
            'HKD': { symbol: 'HK$', name: 'Hong Kong Dollar' },
            'SGD': { symbol: 'S$', name: 'Singapore Dollar' },
            'CHF': { symbol: 'CHF', name: 'Swiss Franc' },
            'KRW': { symbol: '₩', name: 'South Korean Won' },
            'MXN': { symbol: 'Mex$', name: 'Mexican Peso' },
            'BRL': { symbol: 'R$', name: 'Brazilian Real' },
            'ZAR': { symbol: 'R', name: 'South African Rand' },
            'NZD': { symbol: 'NZ$', name: 'New Zealand Dollar' },
            'SEK': { symbol: 'kr', name: 'Swedish Krona' },
            'NOK': { symbol: 'kr', name: 'Norwegian Krone' },
            'ILS': { symbol: '₪', name: 'Israeli New Shekel' },
            'TRY': { symbol: '₺', name: 'Turkish Lira' }
        };

        let primaryCurrency = 'USD';
        let exchangeRates = {};

        function populateCurrencyDropdowns() {
            const options = Object.keys(SUPPORTED_CURRENCIES).map(c => `<option value="${c}">${c}</option>`).join('');
            const pSel = document.getElementById('primaryCurrencySelect');
            const eSel = document.getElementById('expCurrency');
            
            if(pSel) pSel.innerHTML = options;
            if(eSel) eSel.innerHTML = options;

            const expand = () => {
                [pSel, eSel].forEach(sel => {
                    if(!sel) return;
                    Array.from(sel.options).forEach(opt => {
                        const val = opt.value;
                        if(SUPPORTED_CURRENCIES[val]) {
                            opt.text = `${val} - ${SUPPORTED_CURRENCIES[val].symbol} ${SUPPORTED_CURRENCIES[val].name}`;
                        }
                    });
                });
            };

            const collapse = () => {
                [pSel, eSel].forEach(sel => {
                    if(!sel) return;
                    Array.from(sel.options).forEach(opt => {
                        opt.text = opt.value;
                    });
                });
            };

            [pSel, eSel].forEach(sel => {
                if(!sel) return;
                sel.addEventListener('mousedown', expand);
                sel.addEventListener('touchstart', expand, {passive: true});
                sel.addEventListener('focus', expand);
                
                sel.addEventListener('change', collapse);
                sel.addEventListener('blur', collapse);
            });
        }

        async function fetchExchangeRates() {
            const dateKey = new Date().toISOString().split('T')[0];
            const cacheKey = `exchangeRates_${dateKey}`;
            const cached = localStorage.getItem(cacheKey);

            if (cached) {
                exchangeRates = JSON.parse(cached);
                updateUI(); // In case UI rendered before we got this
                return;
            }

            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                if (data && data.rates) {
                    exchangeRates = data.rates;
                    localStorage.setItem(cacheKey, JSON.stringify(exchangeRates));
                    updateUI(); // In case UI rendered before we got this
                }
            } catch (e) {
                console.error("Failed to fetch exchange rates", e);
            }
        }

        // --- Trip Persistence & Recovery ---
        function initTrip() {
            if (!tripId) {
                // Try to recover last trip from localStorage
                const lastTrip = localStorage.getItem('lastTripIdV2');
                if (lastTrip) {
                    tripId = lastTrip;
                    window.location.hash = tripId;
                } else {
                    // Generate new if totally fresh
                    tripId = 'trip-' + Math.random().toString(36).substr(2, 9);
                    window.location.hash = tripId;
                }
            }

            // Save to persistence
            localStorage.setItem('lastTripIdV2', tripId);
            saveToRecentTrips(tripId);
            updateRecentTripsUI();

            // Display ID in UI
            const displayEl = document.getElementById('displayTripId');
            if (displayEl) displayEl.innerText = `ID: ${tripId}`;
        }

        function saveToRecentTrips(id) {
            let recents = JSON.parse(localStorage.getItem('recentTripsV2') || '[]');
            // Move to top or add
            recents = recents.filter(t => t !== id);
            recents.unshift(id);
            // Cap at 5
            localStorage.setItem('recentTripsV2', JSON.stringify(recents.slice(0, 5)));
        }

        window.updateRecentTripsUI = function () {
            const recents = JSON.parse(localStorage.getItem('recentTripsV2') || '[]');
            const container = document.getElementById('recentTripsContainer');
            const list = document.getElementById('recentTripsList');

            if (recents.length > 1) { // Only show if there's more than one trip
                container.classList.remove('hidden');
                list.innerHTML = recents.map(id => `
                    <li class="flex justify-between items-center group">
                        <a href="#${id}" onclick="setTimeout(() => location.reload(), 10)" class="truncate hover:text-blue-600 ${id === tripId ? 'font-bold text-blue-600' : ''}">
                            ${id === tripId ? '👉 ' : ''}${id}
                        </a>
                        ${id !== tripId ? `<button onclick="removeFromHistory('${id}')" class="text-slate-200 group-hover:text-red-400">✕</button>` : ''}
                    </li>
                `).join('');
            } else {
                container.classList.add('hidden');
            }
        }

        window.removeFromHistory = function (id) {
            let recents = JSON.parse(localStorage.getItem('recentTripsV2') || '[]');
            recents = recents.filter(t => t !== id);
            localStorage.setItem('recentTripsV2', JSON.stringify(recents));
            updateRecentTripsUI();
        }

        window.startNewTrip = function () {
            if (confirm("Switch to a clean new trip? Your current trip link will still work!")) {
                const newId = 'trip-' + Math.random().toString(36).substr(2, 9);
                window.location.hash = newId;
                location.reload();
            }
        }

        window.joinTrip = async function () {
            const id = prompt("Enter the Trip ID you want to join (found at the end of the URL):");
            if (id && id.trim()) {
                const cleanId = id.trim();
                setSyncing(true);
                try {
                    const snapshot = await get(ref(db, 'trips/' + cleanId));
                    if (snapshot.exists()) {
                        window.location.hash = cleanId;
                        location.reload();
                    } else {
                        alert("Trip ID not found. Please check the ID and try again.");
                        setSyncing(false);
                    }
                } catch (error) {
                    console.error("Error joining trip:", error);
                    alert("An error occurred while trying to join the trip.");
                    setSyncing(false);
                }
            }
        }

        initTrip();
        populateCurrencyDropdowns();
        fetchExchangeRates();

        const tripRef = ref(db, 'trips/' + tripId);

        // Indicators
        const setSyncing = (isSyncing) => {
            const el = document.getElementById('syncStatus');
            const txt = document.getElementById('syncText');
            if (isSyncing) {
                el.classList.add('syncing');
                txt.innerText = 'Syncing...';
            } else {
                el.classList.remove('syncing');
                txt.innerText = 'Connected';
            }
        };

        window.changePrimaryCurrency = function () {
            const sel = document.getElementById('primaryCurrencySelect').value;
            setSyncing(true);
            set(ref(db, 'trips/' + tripId + '/primaryCurrency'), sel);
        };

        // --- Real-time Sync ---
        onValue(tripRef, (snapshot) => {
            const data = snapshot.val() || {};
            people = data.people || [];
            primaryCurrency = data.primaryCurrency || 'USD';

            // Sync dropdown with current state without triggering onchange recursively
            const primarySelect = document.getElementById('primaryCurrencySelect');
            if (primarySelect.value !== primaryCurrency) {
                primarySelect.value = primaryCurrency;
                document.getElementById('expCurrency').value = primaryCurrency;
            }

            const rawExpenses = data.expenses || {};
            expenses = Object.keys(rawExpenses).map(key => ({
                ...rawExpenses[key],
                firebaseKey: key
            }));

            expenses.sort((a, b) => a.id - b.id);
            updateUI();
            setSyncing(false);
        });

        // --- Global Functions ---
        window.addPerson = function () {
            const input = document.getElementById('personName');
            const name = input.value.trim();
            if (name && !people.includes(name)) {
                setSyncing(true);
                people.push(name);
                set(ref(db, 'trips/' + tripId + '/people'), people);
                input.value = '';
            }
        };

        window.removePerson = function (name) {
            if (confirm(`Remove ${name} and all their linked expenses?`)) {
                setSyncing(true);
                const updatedPeople = people.filter(p => p !== name);
                set(ref(db, 'trips/' + tripId + '/people'), updatedPeople);

                expenses.forEach(e => {
                    if (e.payer === name) {
                        remove(ref(db, 'trips/' + tripId + '/expenses/' + e.firebaseKey));
                    }
                });
            }
        };

        window.addExpense = function () {
            const desc = document.getElementById('expDesc').value;
            const amount = parseFloat(document.getElementById('expAmount').value);
            const currency = document.getElementById('expCurrency').value;
            const category = document.getElementById('expCategory').value;
            const payer = document.getElementById('expPayer').value;

            const selectedPeople = Array.from(document.querySelectorAll('.split-member:checked'))
                .map(cb => cb.value);

            if (!desc) {
                alert("Please enter a description.");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                alert("Please enter a valid positive amount.");
                return;
            }
            if (!payer) {
                alert("Please select who paid (add a person to the group first).");
                return;
            }
            if (selectedPeople.length === 0) {
                alert("Please select at least one person to split with.");
                return;
            }

            setSyncing(true);
            const expense = {
                id: Date.now(),
                timestamp: new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                desc,
                amount,
                currency: currency || primaryCurrency,
                category,
                payer,
                splitWith: selectedPeople
            };

            push(ref(db, 'trips/' + tripId + '/expenses'), expense);

            document.getElementById('expDesc').value = '';
            document.getElementById('expAmount').value = '';
        };

        window.deleteExpense = function (firebaseKey) {
            setSyncing(true);
            remove(ref(db, 'trips/' + tripId + '/expenses/' + firebaseKey));
        };

        window.clearAll = function () {
            if (confirm("⚠️ Are you sure? This will delete ALL trip data (people and expenses) for this link.")) {
                if (confirm("🛑 TRIPLE CONFIRM: This action is permanent and cannot be undone. Are you absolutely certain?")) {
                    if (confirm("🔥 FINAL CHECK: Last chance to cancel. Delete everything now?")) {
                        setSyncing(true);
                        remove(tripRef);
                    }
                }
            }
        };

        window.copyShareLink = function () {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                alert("Link copied to clipboard! Share this URL with your friends to collaborate.");
            });
        };

        // --- UI Rendering ---
        const categoryColors = {
            'Food': 'bg-orange-100 text-orange-700',
            'Transport': 'bg-blue-100 text-blue-700',
            'Lodging': 'bg-purple-100 text-purple-700',
            'Activities': 'bg-green-100 text-green-700',
            'Shopping': 'bg-pink-100 text-pink-700',
            'Other': 'bg-slate-100 text-slate-700'
        };

        const categoryIcons = {
            'Food': '🍔', 'Transport': '🚗', 'Lodging': '🏨', 'Activities': '🎡', 'Shopping': '🛍️', 'Other': '📦'
        };

        function formatCurrency(amount, currencyCode) {
            const sym = SUPPORTED_CURRENCIES[currencyCode] ? SUPPORTED_CURRENCIES[currencyCode].symbol : currencyCode;
            return `${sym}${amount.toFixed(2)}`;
        }

        function updateUI() {
            document.getElementById('peopleList').innerHTML = people.map(p => `
                <li class="flex justify-between items-center bg-white/80 p-3.5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                    <span class="font-bold text-slate-700">${p}</span>
                    <button onclick="removePerson('${p}')" class="text-slate-300 hover:text-red-500 bg-slate-50 hover:bg-red-50 p-1.5 rounded-lg transition-all" title="Remove Member">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                    </button>
                </li>
            `).join('');

            document.getElementById('expPayer').innerHTML = people.map(p => `<option value="${p}">${p}</option>`).join('');
            document.getElementById('splitCheckboxes').innerHTML = people.map(p => `
                <label class="flex items-center gap-2 bg-white/80 border border-slate-200 px-3 py-1.5 rounded-lg cursor-pointer text-sm font-medium hover:bg-slate-50 transition-colors shadow-sm text-slate-700">
                    <input type="checkbox" value="${p}" class="split-member h-4 w-4 rounded text-emerald-500 focus:ring-emerald-500 cursor-pointer" checked> ${p}
                </label>
            `).join('');

            const hList = document.getElementById('historyList');
            if (expenses.length === 0) {
                hList.innerHTML = `<div class="text-center p-8 border-2 border-dashed rounded-2xl text-slate-400">No expenses yet</div>`;
            } else {
                hList.innerHTML = expenses.slice().sort((a, b) => b.id - a.id).map(e => {
                    let eCurrency = e.currency || 'USD';
                    let amountHtml = '';

                    // If it was entered in a secondary currency, display the Base Currency prominently and append the original.
                    if (eCurrency !== primaryCurrency && exchangeRates[primaryCurrency] && exchangeRates[eCurrency]) {
                        let converted = e.amount * (exchangeRates[primaryCurrency] / exchangeRates[eCurrency]);
                        amountHtml += `${formatCurrency(converted, primaryCurrency)}`;
                        amountHtml += ` <span class="text-xs text-slate-400 font-normal opacity-80 block">(Paid: ${formatCurrency(e.amount, eCurrency)})</span>`;
                    } else if (eCurrency !== primaryCurrency && Object.keys(exchangeRates).length === 0) {
                        amountHtml += `${formatCurrency(e.amount, eCurrency)} <span class="text-xs text-slate-400 font-normal opacity-80 block">(Loading conversion...)</span>`;
                    } else {
                        amountHtml += `${formatCurrency(e.amount, eCurrency)}`;
                    }

                    return `
                    <div class="glass-card p-4 sm:p-5 rounded-2xl flex justify-between items-center gap-2 sm:gap-4 shadow-sm hover:shadow-md transition-all duration-300 transform hover:-translate-y-1 group border-l-4 border-l-indigo-400">
                        <div class="flex gap-3 sm:gap-4 items-center flex-1 min-w-0">
                            <div class="h-8 w-8 sm:h-10 sm:w-10 min-w-[2rem] sm:min-w-[2.5rem] flex items-center justify-center bg-slate-50 border border-slate-100 rounded-lg sm:rounded-xl text-lg sm:text-xl shadow-sm group-hover:scale-110 transition-transform duration-300">
                                ${categoryIcons[e.category] || '💰'}
                            </div>
                            <div class="flex-1 min-w-0 flex flex-col justify-center">
                                <div class="mb-0.5 sm:mb-1 pr-2 leading-tight">
                                    <span class="font-bold text-slate-800 text-[13px] sm:text-[15px] line-clamp-2 break-words align-middle inline mr-1.5">${e.desc}</span>
                                    <span class="category-badge ${categoryColors[e.category]} shadow-sm border border-slate-100/50 text-[9px] sm:text-[10px] whitespace-nowrap align-middle inline-block mt-0.5">${e.category}</span>
                                </div>
                                <div class="text-[10px] sm:text-xs text-slate-500 font-medium truncate mt-0.5">
                                    ${e.timestamp} • By <span class="font-bold text-indigo-600">${e.payer}</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end gap-0.5 ml-2">
                            <div class="font-extrabold text-slate-900 leading-tight flex flex-col items-end text-xs sm:text-base">${amountHtml}</div>
                            <div class="text-[9px] sm:text-[10px] text-slate-400 uppercase font-bold tracking-wider mt-0.5 sm:mt-1">${e.splitWith.length} ways</div>
                        </div>
                        <button onclick="deleteExpense('${e.firebaseKey}')" class="text-slate-300 hover:text-red-500 hover:bg-red-50 p-1.5 sm:p-2 rounded-xl transition-all text-lg sm:text-xl ml-1 sm:ml-2" title="Delete Expense">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 sm:h-5 sm:w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                `}).join('');
            }

            calculateBalances();
        }

        function calculateBalances() {
            const container = document.getElementById('balanceContainer');
            if (people.length === 0) {
                container.innerHTML = `<p class="text-slate-400 text-sm italic">Add group members to start.</p>`;
                return;
            }

            let balances = {};
            let amountPaidBy = {};
            let totalSpent = 0;

            people.forEach(p => { 
                balances[p] = 0; 
                amountPaidBy[p] = 0;
            });

            expenses.forEach(exp => {
                let eCurrency = exp.currency || 'USD';
                let expValue = exp.amount;

                // Convert to primary currency
                if (eCurrency !== primaryCurrency && exchangeRates[primaryCurrency] && exchangeRates[eCurrency]) {
                    expValue = exp.amount * (exchangeRates[primaryCurrency] / exchangeRates[eCurrency]);
                }

                totalSpent += expValue;
                if(amountPaidBy[exp.payer] !== undefined) amountPaidBy[exp.payer] += expValue;

                if(balances[exp.payer] !== undefined) balances[exp.payer] += expValue;
                const share = expValue / exp.splitWith.length;
                exp.splitWith.forEach(p => {
                    if(balances[p] !== undefined) balances[p] -= share;
                });
            });

            let debtors = [];
            let creditors = [];
            for (let person in balances) {
                if (balances[person] < -0.01) debtors.push({ name: person, amt: Math.abs(balances[person]) });
                else if (balances[person] > 0.01) creditors.push({ name: person, amt: balances[person] });
            }

            let instructions = [];
            let dIdx = 0, cIdx = 0;
            const primarySym = SUPPORTED_CURRENCIES[primaryCurrency] ? SUPPORTED_CURRENCIES[primaryCurrency].symbol : primaryCurrency;

            while (dIdx < debtors.length && cIdx < creditors.length) {
                let d = debtors[dIdx], c = creditors[cIdx];
                let settle = Math.min(d.amt, c.amt);
                instructions.push(`<strong>${d.name}</strong> owes <strong>${c.name}</strong> <span class="text-blue-600 font-bold">${primarySym}${settle.toFixed(2)}</span>`);
                d.amt -= settle; c.amt -= settle;
                if (d.amt <= 0.01) dIdx++;
                if (c.amt <= 0.01) cIdx++;
            }

            let summaryHtml = `
                <div class="bg-indigo-50/50 p-5 rounded-2xl border border-indigo-100 shadow-sm mb-5">
                    <div class="text-[11px] text-indigo-500 uppercase font-extrabold tracking-widest mb-1.5 flex items-center gap-1.5">
                        <span class="text-indigo-400">💰</span> Total Trip Cost
                    </div>
                    <div class="text-3xl font-black text-indigo-700 tracking-tight drop-shadow-sm">${primarySym}${totalSpent.toFixed(2)}</div>
                    ${totalSpent > 0 ? `
                    <div class="mt-4 pt-4 border-t border-indigo-100/60 space-y-2">
                        ${Object.keys(amountPaidBy).filter(p => amountPaidBy[p] > 0).map(p => `
                            <div class="flex justify-between items-center text-sm">
                                <span class="font-bold text-slate-600">${p} <span class="font-medium text-slate-400">paid</span></span>
                                <span class="font-extrabold text-slate-800 bg-white px-2 py-0.5 rounded shadow-sm border border-slate-100">${primarySym}${amountPaidBy[p].toFixed(2)}</span>
                            </div>
                        `).join('')}
                    </div>` : ''}
                </div>
            `;

            let settlementsHtml = instructions.length === 0
                ? `<p class="text-slate-500 text-sm font-bold text-center py-4 bg-white/50 rounded-xl">Everyone is settled up! 🎉</p>`
                : `<div class="space-y-2.5 text-slate-800">
                    <div class="text-[11px] text-slate-500 uppercase font-extrabold tracking-widest mb-2 flex items-center gap-1.5">
                        <span class="text-slate-400">🤝</span> How to Settle
                    </div>` + 
                  instructions.map(ins => `
                    <div class="bg-white/90 p-3.5 rounded-xl border border-blue-100 shadow-sm text-sm flex items-center gap-3 font-medium hover:-translate-y-0.5 transition-transform">
                        <span class="text-blue-500 bg-blue-50 p-1.5 rounded-lg border border-blue-100/50">💸</span> ${ins}
                    </div>
                `).join('') + `</div>`;

            container.innerHTML = summaryHtml + settlementsHtml;
        }
    </script>
</body>

</html>
